[bumpversion]
current_version = 0.1.90
commit = True
tag = True

[bumpversion:file:_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:setup.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:setup.cfg]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:README.rst]
search = **Current Version: {current_version}**
replace = **Current Version: {new_version}**

[bumpversion:file:org.shenko.shenko.json]
search = "tag": "v{current_version}"
replace = "tag": "v{new_version}"

[bumpversion:file:org.shenko.shenko.appdata.xml]
search = <release version="{current_version}"
replace = <release version="{new_version}"
